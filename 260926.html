<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run of Show · 26.09.2026</title>
<style>
  :root{--bg:#0e1116;--card:#191d26;--text:#eef1f6;--muted:#9aa3b2;--accent:#ff4d4f;--green:#2fd17a;--green-soft:rgba(47,209,122,.14);--border:#2a3040;--radius:14px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;padding-bottom:24px}
  header{position:sticky;top:0;z-index:10;background:rgba(14,17,22,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px}
  header a{color:var(--text);text-decoration:none;font-size:22px;border:1px solid var(--border);width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  header h1{margin:0;font-size:17px;font-weight:700}
  header .sub{color:var(--muted);font-size:13px}
  main{padding:16px;max-width:760px;margin:0 auto}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 10px}
  .box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
  .critical{background:rgba(255,77,79,.1);border:1px solid rgba(255,77,79,.45);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
  .crit-title{color:#ff6b6b;font-weight:800;font-size:15px;margin-bottom:10px}
  .crit-item{margin-bottom:11px}
  .crit-item:last-child{margin-bottom:0}
  .crit-item b{color:#ffd1d1;display:block;margin-bottom:3px}
  .crit-h{color:#ffb3b3;font-size:13.5px}
  .step{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:8px;cursor:pointer}
  .step.done{border-color:rgba(47,209,122,.4);background:var(--green-soft)}
  .step .cb{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent;margin-top:1px}
  .step.done .cb{background:var(--green);border-color:var(--green);color:#06291a}
  .step .txt{flex:1}
  .step .h{color:var(--muted);font-size:13px;margin-top:3px}
  .flow-title{color:#cfd6e0;font-weight:700;font-size:14px;margin-bottom:6px}
  .flow-line{color:var(--text);font-size:14px;padding:6px 0 6px 12px;border-left:2px solid var(--border);margin-left:4px}
  .progress .bar{height:8px;border-radius:99px;background:var(--border);overflow:hidden}
  .progress .bar i{display:block;height:100%;background:var(--green);width:0;transition:width .25s ease}
  .progress .row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px}
  .btn{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer}
  .btn:active{transform:scale(.98)}
</style>
</head>
<body>
  <header>
    <a href="index.html" title="Назад">‹</a>
    <div><h1>Run of Show</h1><div class="sub">Мероприятие 26.09.2026</div></div>
  </header>
  <main id="app"></main>
  <script>
  const CRITICAL = [
    { t: "МЬЮТ ПЕТЛИЧКИ", h: "Если А.В. начинает говорить в ручной микрофон — НЕЗАМЕДЛИТЕЛЬНО мьютить его петличку (на приёмнике или в Zoom), чтобы не было эха, дублирования и задержки." },
    { t: "ГОРЯЧАЯ ЗАМЕНА (2 XLR-канала)", h: "Взял гарнитуру → выключить один ручной микрофон → подключить гарнитуру (остаётся 1 микрофон + 1 гарнитура). Снял гарнитуру → отключить её → вернуть второй ручной микрофон." },
    { t: "РАСПРЕДЕЛЕНИЕ РАДИОСИСТЕМ", h: "Петличка №1 — строго А.В. · Петличка №2 — строго Маша · Гарнитура (опц., 1 шт.) — только у А.В." }
  ];

  const SECTIONS = [
    { name: "📍 Тайминг (T-60)", steps: [
      { t: "T-60: полная готовность видео-, аудио- и светового сетапа" },
      { t: "T-60…40: саундчек", h: "Лёша/Саша с гарнитурой · проконтролировать цепь: Пульт → Zoom → Видеомикшер (vMix/ATEM) → Эфир" }
    ]},
    { name: "💡 Свет и монтаж", steps: [
      { t: "Aputure 120d + каширующая шторка — на ферму справа", h: "направить строго на позицию спикера" },
      { t: "Взять клемпу и страховочный тросик", h: "4-й этаж, студия, в углу на стеллаже" },
      { t: "Взять стремянку", h: "техническая рубка, дальше по коридору" }
    ]},
    { name: "🎥 Эфир и режиссура", steps: [
      { t: "Отдать спикеру кликер для слайдов" },
      { t: "Держать готовой сцену PiP на микшере", h: "полноэкранная презентация + крупный/общий план спикера" }
    ]}
  ];

  const FLOW_AUDIO = [
    "Входы пульта: 2 ручных микрофона ИЛИ (1 ручной микрофон + 1 гарнитура А.В.)",
    "Выход пульта (L/R Main) → Рекордер Zoom → Видеомикшер → Эфир",
    "Выход пульта (Канал 2) → Колонка 1 → Колонка 2 (линкование в зале)",
    "Петлички (А.В. + Маша) → напрямую в рекордер Zoom (чистая локальная запись)"
  ];

  const FLOW_VIDEO = [
    "Камера 1 (общий план) + Камера 2 (крупный план) → входы 1 и 2 видеомикшера (vMix/ATEM)",
    "Ноутбук с презентацией → HDMI-сплиттер: Выход 1 → проектор в зал · Выход 2 → вход 3 микшера"
  ];

  const LSKEY = "ros-260926";
  let progress = {};
  try { progress = JSON.parse(localStorage.getItem(LSKEY) || "{}"); } catch(e){ progress = {}; }
  function save(){ try{ localStorage.setItem(LSKEY, JSON.stringify(progress)); }catch(e){} }
  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  const app = document.getElementById("app");

  function render(){
    let total = 0, done = 0;
    SECTIONS.forEach((s, si) => s.steps.forEach((st, i) => { total++; if (progress[si+"-"+i]) done++; }));
    const pct = total ? Math.round(done/total*100) : 0;

    let html = `
      <div class="critical">
        <div class="crit-title">🚨 Критические операционные правила</div>
        ${CRITICAL.map((r,i) => `<div class="crit-item"><b>${i+1}. ${esc(r.t)}</b><div class="crit-h">${esc(r.h)}</div></div>`).join("")}
      </div>
      <div class="box progress">
        <div class="row"><span style="color:var(--muted)">Выполнено</span><span>${done} / ${total}</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
      </div>`;

    SECTIONS.forEach((s, si) => {
      html += `<div class="box"><h2>${esc(s.name)}</h2>`;
      s.steps.forEach((st, i) => {
        const d = !!progress[si+"-"+i];
        html += `<div class="step ${d?"done":""}" data-k="${si}-${i}"><div class="cb">${d?"✓":""}</div><div class="txt">${esc(st.t)}${st.h?`<div class="h">${esc(st.h)}</div>`:""}</div></div>`;
      });
      html += `</div>`;
    });

    html += `
      <div class="box"><h2>🎛 Схема коммутации (signal flow)</h2>
        <div class="flow-title">🔊 Аудио (XLR)</div>
        ${FLOW_AUDIO.map(x => `<div class="flow-line">${esc(x)}</div>`).join("")}
        <div class="flow-title" style="margin-top:14px">🎥 Видео (HDMI)</div>
        ${FLOW_VIDEO.map(x => `<div class="flow-line">${esc(x)}</div>`).join("")}
      </div>
      <button class="btn" id="reset">Сбросить</button>`;

    app.innerHTML = html;
    app.querySelectorAll(".step").forEach(el => el.addEventListener("click", () => { progress[el.dataset.k] = !progress[el.dataset.k]; save(); render(); }));
    document.getElementById("reset").addEventListener("click", () => { progress = {}; save(); render(); });
  }

  render();

  </script>
</body>
</html>
